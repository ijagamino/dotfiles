[colors]
background = ${colors.bg0}
background-alt = ${colors.blue}
foreground = ${colors.fg0}
primary = ${colors.orange}
secondary = ${colors.yellow}
alert = ${colors.red}
border = ${colors.grey0}

[bar/mainbar]
monitor = ${env:MONITOR:}
height = 48
padding-left = 16px
padding-right = 16px

override-redirect = true
wm-restack = i3

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

foreground = ${colors.foreground}
background = ${colors.background}

font-0 = DepartureMono Nerd Font Propo:size=14;4
font-1 = DepartureMono Nerd Font Propo:size=28:weight=bold;8

modules-left = cpu memory network
modules-center = date
modules-right = battery backlight audio
module-margin = 1

[module/spacer]
type = custom/text

format = <label>
label = " "

[module/spacerbg]
type = custom/text

format = <label>
format-background = ${colors.background}
format-padding = 4pt
label = " "

[module/left]
type = custom/text

format = <label>
format-foreground = ${colors.background}
label = ""
label-font = 2

[module/right]
type = custom/text

format = <label>
format-foreground = ${colors.background}
label = ""
label-font = 2

[module/xworkspaces]
type = internal/xworkspaces

label-active = ●
label-active-padding = 3pt
label-active-font = 3

label-occupied = ○
label-occupied-padding = 3pt
label-occupied-font = 3

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 80

format = <label>
label = %percentage%

format-prefix = " "
format-prefix-foreground = ${colors.fg0}

format-warn = " "
format-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 80

format = <label>
label = %percentage_used%
label-foreground = ${colors.bg0}
label-background = ${colors.fg0}
label-padding = 1

format-prefix = ""
format-prefix-foreground = ${colors.bg0}
format-prefix-background = ${colors.fg0}
format-prefix-padding-left = 1

format-warn = ""
format-warn-foreground = ${colors.alert}

[module/network]
type = internal/network
interface-type = wireless

format-connected = <ramp-signal>
format-disconnected = <label-disconnected>

label-connected = %essid%
label-connected-foreground = ${colors.fg0}
ramp-signal-0-foreground = ${colors.red}
ramp-signal-1-foreground = ${colors.red}
ramp-signal-2-foreground = ${colors.yellow}
ramp-signal-3-foreground = ${colors.yellow}
ramp-signal-4-foreground = ${colors.green}

label-disconnected = 󰤮
label-disconnected-foreground = ${colors.fg0}

ramp-signal-0 = "󰤯 1"
ramp-signal-1 = "󰤟 2"
ramp-signal-2 = "󰤢 3"
ramp-signal-3 = "󰤥 4"
ramp-signal-4 = "󰤨 5"


[module/xwindow]
type = internal/xwindow

label = %class%

[module/battery]
type = internal/battery
full-at = 98
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage_raw%

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.fg0}
label-charging = %percentage_raw%
animation-charging-framerate = 750

format-full = <ramp-capacity> <label-full>
label-full = %percentage_raw%

ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.yellow}
ramp-capacity-2-foreground = ${colors.green}

ramp-capacity-0 = 󱊡
ramp-capacity-1 = 󱊢
ramp-capacity-2 = 󱊣
animation-charging-0 = 󰂎
animation-charging-1 = 󱊡
animation-charging-2 = 󱊢
animation-charging-3 = 󱊣

[module/backlight]
type = internal/backlight
format = <ramp><label>
label = %percentage%

label-foreground = ${colors.bg0}
label-background = ${colors.fg0}
label-padding = 1
ramp-foreground = ${colors.bg0}
ramp-background = ${colors.fg0}
ramp-padding-left = 1

ramp-0 = 󱩎
ramp-1 = 󱩏
ramp-2 = 󱩐
ramp-3 = 󱩑
ramp-4 = 󱩒
ramp-5 = 󱩓
ramp-6 = 󱩔
ramp-7 = 󱩕
ramp-8 = 󱩖
ramp-9 = 󰛨

[module/audio]
type = internal/pulseaudio

format-volume = <ramp-volume><label-volume>
label-volume = %percentage%
; label-volume-foreground = ${colors.bg0}
; label-volume-background = ${colors.fg0}
; label-volume-padding = 1

; ramp-volume-foreground = ${colors.bg0}
; ramp-volume-background = ${colors.fg0}
ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
ramp-volume-padding-right = 1

label-muted = 󰖁 MUTED
; label-muted-foreground = ${colors.bg0}
; label-muted-background = ${colors.fg0}
; label-muted-padding = 1

; format-prefix-foreground = ${colors.bg0}
; format-prefix-background = ${colors.fg0}
; format-prefix-padding-left = 1

click-right = pavucontrol

[module/date]
type = internal/date
interval = 1
time = %I:%M
time-alt = %m-%d-%y

label = %time%
label-foreground = ${colors.bg0}
label-background = ${colors.fg0}
label-padding = 1
label-font = 2

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
