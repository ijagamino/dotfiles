[colors]
bg0 = #1d2021
fg0 = #d4be98

red = #ea6962
green = #a9b665
blue = #7daea3
yellow = #d8a657
purple = #d3869b
orange = #e78a4e
aqua = #89b482
transparent = #FF00000

grey0 = #7c6f64
grey2 = #a89984

